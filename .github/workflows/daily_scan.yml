name: Daily Swing Scan

on:
  schedule:
    # 10:45 UTC = 16:15 IST (after NSE close)
    - cron: "45 10 * * 1-5"
  workflow_dispatch:  # manual trigger from Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy ta requests pytz lxml html5lib beautifulsoup4

      - name: Run daily scan
        run: |
          python scripts/daily_scan.py

      - name: Commit & push cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily scan cache $(date -u +%Y-%m-%d)"
            git push
          fi
